name: Deploy Straight HTML/JS to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your primary branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Firebase Secrets
        env:
          API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          sed -i "s|__FIREBASE_API_KEY__|$API_KEY|g" js/firebase-config.js
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|$AUTH_DOMAIN|g" js/firebase-config.js
          sed -i "s|__FIREBASE_PROJECT_ID__|$PROJECT_ID|g" js/firebase-config.js
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|$STORAGE_BUCKET|g" js/firebase-config.js
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|$MESSAGING_SENDER_ID|g" js/firebase-config.js
          sed -i "s|__FIREBASE_APP_ID__|$APP_ID|g" js/firebase-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads root directory

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
